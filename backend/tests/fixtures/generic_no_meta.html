  <h1>내년 예산안 국무회의 통과…의료·상수도 예산 신설</h1>
  <article>
        <p>정부는 3일 국무회의를 열고 내년도 예산안의 세부 편성 방향을 확정했다고 밝혔다.</p>
        <p>이번 편성안에는 지역 의료 인력 확충과 노후 상수도 정비 예산이 새로 포함됐다.</p>
        <p>다만 재원 조달 방안을 두고는 이견이 남아 있어 국회 심의 과정에서 조정될 가능성이 크다.</p>
        <p>야당은 세수 추계가 낙관적이라고 지적했고, 정부는 근거 자료를 추가로 제출하겠다고 답했다.</p>
        <p>관련 상임위원회는 이달 중순부터 예산안 심사를 시작할 예정이다..</p>
  </article>
